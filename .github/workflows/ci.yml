name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content validator
        run: npm run validate
      - name: Build content packs
        run: npm run content
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build web (PWA)
        run: npm run build:web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (phone, tablet, desktop, projector) with accessibility checks
        run: npx playwright test --trace off
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/
          retention-days: 7
